services:
  db:
    image: postgres:16-alpine
    container_name: minishop-db
    environment:
      POSTGRES_USER: minishop
      POSTGRES_PASSWORD: minishop
      POSTGRES_DB: minishop
    ports:
      - "5432:5432"
    volumes:
      - minishop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minishop -d minishop"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  minishop_pgdata:
